site_name: BRHealth Documentation
site_description: Motor Analítico Colunar de Alta Performance para Saúde Coletiva e Determinantes Sociais
site_author: Marcel <MarcelDevBr>
site_url: https://marceldevbr.github.io/brhealth/
repo_name: MarcelDevBr/brhealth
repo_url: https://github.com/MarcelDevBr/brhealth
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view

markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

validation:
  omitted_files: ignore
  links:
    anchors: ignore
    unrecognized_links: ignore
    not_found: warn

nav:
  - Início: README.md
  - Primeiros Passos:
      - Instalação Modular: INSTALLATION.md
      - Manual Prático Geral: USAGE_GUIDE.md
  - 🐍 Python:
      - ⚡ Guia Rápido (Quickstart): PYTHON_QUICKSTART.md
      - 📘 Guia Definitivo: PYTHON_GUIDE.md
      - 📋 API para Pesquisadores: BRHealth_API_Python_Ciencia_de_Dados.md
  - 🏥 Bioestatística & Economia:
      - Custos Hospitalares de CSAP: architecture/exemplo_analise_custos_csap.md
  - 📐 Arquitetura & Engenharia:
      - Software Design Document (SDD): architecture/sdd_brhealth.md
      - Objetos da API Universal: BRHealth_Objetos_API_Universal.md
      - Extensão de Fontes (SPI): EXTENDING_BRHEALTH.md
      - Governança e LGPD: LGPD_GOVERNANCE.md
      - CI/CD e Workflows: CICD_AND_WORKFLOWS.md
      - Análise Técnica: BRHealth_Analise_Tecnica.md
      - Manifesto Conceitual: architecture/ideia.md
