[workspace]
members = [
    "crates/brhealth-core",
    "crates/brhealth-ffi",
    "crates/brhealth-python",
    "crates/brhealth-jni",
    "crates/brhealth-cli",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["Marcel <MarcelDevBr>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/MarcelDevBr/brhealth"
homepage = "https://github.com/MarcelDevBr/brhealth"

[workspace.dependencies]
arrow = { version = "53.0", features = ["ffi", "ipc", "chrono-tz"] }
parquet = { version = "53.0", features = ["arrow"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
rayon = "1.10"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
h3o = "0.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
bytes = "1.10"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
