name: Release Multiplatform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version to release (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            is_windows: false

          # Linux x86_64 (musl - Fully Static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            is_windows: false

          # Linux ARM64 (aarch64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            is_windows: false

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            is_windows: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            is_windows: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            is_windows: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (Linux ARM64 only)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Native / Cargo)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --package brhealth-cli --bin brhealth --target ${{ matrix.target }}

      - name: Build Binary (Cross-compilation)
        if: matrix.use_cross
        run: |
          cross build --release --package brhealth-cli --bin brhealth --target ${{ matrix.target }}

      - name: Determine Version Tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Package Unix Archive (.tar.gz)
        if: "!matrix.is_windows"
        shell: bash
        run: |
          BIN_PATH="target/${{ matrix.target }}/release/brhealth"
          if command -v strip &>/dev/null; then
            strip "$BIN_PATH" || true
          fi
          ARCHIVE_NAME="brhealth-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          tar -czvf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" brhealth
          if command -v sha256sum &>/dev/null; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=${ARCHIVE_NAME}.sha256" >> $GITHUB_ENV

      - name: Package Windows Archive (.zip)
        if: matrix.is_windows
        shell: pwsh
        run: |
          $binPath = "target/${{ matrix.target }}/release/brhealth.exe"
          $archiveName = "brhealth-${env:RELEASE_TAG}-${{ matrix.target }}.zip"
          Compress-Archive -Path $binPath -DestinationPath $archiveName -Force
          $hash = (Get-FileHash -Path $archiveName -Algorithm SHA256).Hash.ToLower()
          "$hash  $archiveName" | Out-File -FilePath "${archiveName}.sha256" -Encoding ascii
          "ARCHIVE_PATH=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CHECKSUM_PATH=${archiveName}.sha256" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.CHECKSUM_PATH }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Determine Version Tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="${{ github.event.inputs.tag_name || 'v1.0.0' }}"
          fi
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          echo "=== Manifestos SHA-256 de Proveniência FAIR ==="
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "BRHealth CLI Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
