name: Release Multiplatform Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version to release (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
            is_windows: false

          # Linux x86_64 (musl - Fully Static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: false
            is_windows: false

          # Linux ARM64 (aarch64)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true
            is_windows: false

          # macOS Apple Silicon (ARM64)
          - target: aarch64-apple-darwin
            os: macos-latest
            use_cross: false
            is_windows: false

          # macOS Intel (x86_64)
          - target: x86_64-apple-darwin
            os: macos-13
            use_cross: false
            is_windows: false

          # Windows x86_64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use_cross: false
            is_windows: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux musl only)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Cross (Linux ARM64 only)
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary (Native / Cargo)
        if: "!matrix.use_cross"
        run: |
          cargo build --release --package brhealth-cli --bin brhealth --target ${{ matrix.target }}

      - name: Build Binary (Cross-compilation)
        if: matrix.use_cross
        run: |
          cross build --release --package brhealth-cli --bin brhealth --target ${{ matrix.target }}

      - name: Package Unix Archive (.tar.gz)
        if: "!matrix.is_windows"
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/brhealth"
          if command -v strip &>/dev/null; then
            strip "$BIN_PATH" || true
          fi
          BASE_NAME="brhealth-${RELEASE_TAG}-${{ matrix.target }}.tar.gz"
          ARCHIVE_PATH="dist/${BASE_NAME}"
          tar -czvf "$ARCHIVE_PATH" -C "target/${{ matrix.target }}/release" brhealth
          if command -v sha256sum &>/dev/null; then
            (cd dist && sha256sum "$BASE_NAME" > "${BASE_NAME}.sha256")
          else
            (cd dist && shasum -a 256 "$BASE_NAME" > "${BASE_NAME}.sha256")
          fi

      - name: Package Windows Archive (.zip)
        if: matrix.is_windows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $binPath = "target/${{ matrix.target }}/release/brhealth.exe"
          $baseName = "brhealth-${env:RELEASE_TAG}-${{ matrix.target }}.zip"
          $archivePath = Join-Path "dist" $baseName
          Compress-Archive -Path $binPath -DestinationPath $archivePath -Force
          $hash = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          "$hash  $baseName" | Out-File -FilePath "${archivePath}.sha256" -Encoding ascii

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Generate Consolidated SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          cat *.sha256 > SHA256SUMS.txt
          echo "=== Manifestos SHA-256 de Proveniência FAIR ==="
          cat SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "BRHealth CLI Release ${{ env.RELEASE_TAG }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
