name: BRHealth CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "*.md"
      - "*.ipynb"
      - ".gitignore"
      - "LICENSE"
      - "CITATION.cff"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "examples/**"
      - "*.md"
      - "*.ipynb"
      - ".gitignore"
      - "LICENSE"
      - "CITATION.cff"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-lint:
    name: Formatting & Strict Clippy Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Code Formatting (cargo fmt)
        run: cargo fmt --all --check

      - name: Run Strict Clippy (Zero Warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test Suite & Doc-Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/')) && fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run All Workspace Tests
        run: cargo test --workspace

      - name: Run Executable Doc-Tests
        run: cargo test --workspace --doc

  python-sanity:
    name: Python Package & Symbol Sanity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Maturin
        run: pip install maturin

      - name: Build Python Extension in Development Mode
        run: |
          maturin build --manifest-path crates/brhealth-python/Cargo.toml
          pip install target/wheels/*.whl

      - name: Verify Exported Symbols & Python API Sanity
        run: |
          python -c "import brhealth; print('Versao:', brhealth.__version__)"
          python -c "import brhealth; assert hasattr(brhealth, 'read_dbc'), 'read_dbc ausente no modulo Python'"
          python -c "import brhealth; assert hasattr(brhealth, 'read_dbf'), 'read_dbf ausente no modulo Python'"
          python -c "import brhealth; assert hasattr(brhealth, 'decompress_dbc'), 'decompress_dbc ausente no modulo Python'"
          python -c "import brhealth; assert hasattr(brhealth, 'check_environment'), 'check_environment ausente no modulo Python'"
          python -c "import brhealth; assert hasattr(brhealth, 'BRHealthError'), 'BRHealthError ausente no modulo Python'"
          python -c "import brhealth; assert hasattr(brhealth, 'SourceNotFoundError'), 'SourceNotFoundError ausente no modulo Python'"
          python -c "import brhealth; e = brhealth.Engine(); assert 'datasus.sih' in e.list_sources()"
          python -c "import brhealth; e = brhealth.Engine(); batch = e.fetch(source_id='datasus_sih'); print('Alias datasus_sih OK')"

  security-audit:
    name: Supply Chain Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Pre-built Cargo Audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run Cargo Audit
        run: cargo audit

  bench-check:
    name: Benchmarks Compilation Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Benchmarks Compilation
        run: cargo bench --workspace --no-run
