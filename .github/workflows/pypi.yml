name: Build & Publish Python Wheels (PyPI & GitHub)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version to build wheels for (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write
  id-token: write # Necessário para autenticação OIDC Trusted Publishing no PyPI

jobs:
  build-wheels:
    name: Build Wheels (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc / manylinux)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto

          # Linux ARM64 (aarch64)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin

          # macOS Intel (x86_64) (Cross-compiled from Apple Silicon)
          - os: macos-latest
            target: x86_64-apple-darwin

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build Wheels via Maturin
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path crates/brhealth-python/Cargo.toml --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}

      - name: Upload Wheel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*

  sdist:
    name: Build Source Distribution (sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build sdist via Maturin
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/brhealth-python/Cargo.toml --out dist

      - name: Upload sdist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist/*

  publish:
    name: Publish Wheels to GitHub Releases & PyPI
    needs: [build-wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Wheel Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Display Generated Wheels
        shell: bash
        run: |
          echo "=== Pacotes Python (.whl / .tar.gz) Gerados ==="
          ls -lh dist/

      - name: Attach Wheels to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v0.1.0' }}
          files: dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          packages-dir: dist/
