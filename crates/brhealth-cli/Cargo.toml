[package]
name = "brhealth-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Interface de linha de comando (CLI) nativa para o motor analítico colunar BRHealth"

[[bin]]
name = "brhealth"
path = "src/main.rs"

[dependencies]
brhealth-core = { path = "../brhealth-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
serde_json = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/brhealth-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

