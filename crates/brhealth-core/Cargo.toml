[package]
name = "brhealth-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Motor colunar de alto desempenho para dados de saúde coletiva e determinantes sociais"

[dependencies]
arrow = { workspace = true }
parquet = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
sha2 = { workspace = true }
uuid = { workspace = true }
h3o = { workspace = true }
reqwest = { workspace = true }
bytes = { workspace = true }
serde_yaml = { workspace = true }

[dev-dependencies]
tempfile = "3.12"
proptest = "1.5"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "core_benchmarks"
harness = false

[[example]]
name = "sim_datasus_full_pipeline"
path = "../../examples/sim_datasus_full_pipeline.rs"

[[example]]
name = "csap_health_economics_roi"
path = "../../examples/csap_health_economics_roi.rs"
